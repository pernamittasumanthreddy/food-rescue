version: '3.8'

services:
  # Frontend Web Client (Production Nginx Container)
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: foodrescue-web
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - foodrescue-net

networks:
  foodrescue-net:
    driver: bridge
